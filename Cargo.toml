[package]
name = "kokoro"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust inference engine for hexgrad/Kokoro-82M"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "kokoro"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
matrixmultiply = { version = "0.3.11", features = ["threading"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = 1

[profile.test]
opt-level = 3
